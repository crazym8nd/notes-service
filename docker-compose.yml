services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infrastructure/keycloak/notes-realm.json:/opt/keycloak/data/import/notes-realm.json:ro
    ports:
      - "${KC_PORT:-8180}:8080"

  notes-service:
    platform: ${APP_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        BUILD_IMAGE: ${BUILD_IMAGE:-maven:3.9-eclipse-temurin-17-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-eclipse-temurin:17-jre-alpine}
    environment:
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/notes
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - keycloak
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges"]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped
