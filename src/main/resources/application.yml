spring:
  application:
    name: notes-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/notes}
  datasource:
    url: ${H2_URL:jdbc:h2:mem:notes;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    enabled: ${TRACING_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
